<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Kalender</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container-header">
        <h1 id="header-text">Kalenderblatt vom 13.07.2026</h1>
    </div>
    <div class="container-paragraph">
        <p>
            Der <span id="formatted-date"></span> ist ein <span class="week-day-name"></span>
            und zwar der <span id="week-day-occurrence"></span> <span class="week-day-name"></span>
            im Monat <span class="month-name"></span> des Jahres <span id="year"></span>.<br>
            Es handelt sich um den <span id="day-of-year"></span>. Tag des Jahres, 
            was bedeutet, dass es noch <span id="days-remaining"></span> Tage bis zum Jahresende sind.<br>
            Der Monat <span class="month-name"></span> hat insgesamt 
            <span id="days-in-month"></span> Tage.<br>
        </p>
        <p id="holiday-text"></p>
    </div>
    <div class="container-table">
        <table>
            <h3 id="month-heading">Juli</h3>
            <thead>
                <tr>
                    <th>Mo</th>
                    <th>Di</th>
                    <th>Mi</th>
                    <th>Do</th>
                    <th>Fr</th>
                    <th>Sa</th>
                    <th>So</th>
                </tr>
            </thead>
            <tbody id="calendar-body">
            </tbody>
        </table>
    </div>
    <div class="container-events">
        <h2 id="events-heading"></h2>
    </div>
    <div class="container-list">
        <ul id="events-list"></ul>
    </div>
    <script src="script.js"></script>
</body>

</html>
